[[d1_databases]]
binding = "DB"
database_name = "mytask_cf"
database_id = "4aa0013f-dba6-46fd-82bd-29e9221a01c2"
migrations_dir = "migrations"


[vars]
OPENAI_MODEL = "meta/llama-3.1-8b-instruct"
